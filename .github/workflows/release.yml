# Tag a release (git tag v1.0.0 && git push --tags) →
#  - agent: standalone binaries (Windows + macOS) via bun
#  - overlay: signed + notarized macOS .dmg via electron-builder
# all attached to the GitHub Release.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: agent
      - name: Build binaries
        working-directory: agent
        run: |
          mkdir -p dist
          bun build src/index.mjs --compile --target=bun-windows-x64 --outfile dist/cward-agent-windows-x64.exe
          bun build src/index.mjs --compile --target=bun-darwin-arm64 --outfile dist/cward-agent-macos-arm64
          bun build src/index.mjs --compile --target=bun-darwin-x64  --outfile dist/cward-agent-macos-x64
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: agent/dist/cward-agent-*

  overlay-mac:
    # Apple Silicon runner → arm64 .dmg. Needs these repo secrets (set once):
    #   CSC_LINK (Developer ID .p12 base64), CSC_KEY_PASSWORD,
    #   APPLE_API_KEY_P8 (ASC key .p8 base64), APPLE_API_KEY_ID, APPLE_API_ISSUER
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: overlay
        run: npm ci
      - name: Build, sign, notarize, staple
        working-directory: overlay
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: 2S9H42VJUA
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$KEY"
          # electron-builder signs the .app and notarizes it (via the ASC key)
          APPLE_API_KEY="$KEY" npm run dist
          # electron-builder does not staple the .dmg itself — notarize + staple it too
          DMG="dist/cward-overlay-macos-arm64.dmg"
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          rm -f "$KEY"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: overlay/dist/cward-overlay-macos-arm64.dmg
