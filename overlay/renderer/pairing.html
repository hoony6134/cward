<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cward 폰 연동</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #070d16; color: #e6edf6; text-align: center;
      padding: 24px 20px; user-select: none;
    }
    h1 { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
    p.sub { font-size: 12.5px; color: #8aa0b8; margin: 0 0 18px; line-height: 1.5; }
    .qr { background: #fff; border-radius: 14px; padding: 12px; display: inline-block; }
    .qr img { display: block; width: 280px; height: 280px; }
    .link {
      margin-top: 16px; font-size: 11px; color: #7f95ad; word-break: break-all;
      background: #0e1626; border: 1px solid #1c2a40; border-radius: 10px; padding: 10px 12px;
      user-select: text;
    }
    button {
      margin-top: 12px; font-size: 13px; font-weight: 600; color: #e6edf6;
      background: #1b4bd6; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .hint { margin-top: 14px; font-size: 11.5px; color: #6b8099; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>폰으로 QR 스캔</h1>
  <p class="sub">폰 카메라로 아래 QR을 스캔하면 바로 연동됩니다.<br />터미널 필요 없이, 이 창만 띄워두세요.</p>
  <div class="qr"><img id="qr" alt="pairing QR" /></div>
  <div class="link" id="link">링크 불러오는 중…</div>
  <button id="copy">링크 복사</button>
  <p class="hint">연동 후에는 이 창을 닫아도 됩니다.<br />메뉴바 아이콘에서 언제든 다시 열 수 있어요.</p>
  <script>
    const img = document.getElementById('qr');
    const linkEl = document.getElementById('link');
    const copyBtn = document.getElementById('copy');
    let currentLink = '';
    window.cward.onPairing(({ link, qr }) => {
      currentLink = link;
      img.src = qr;
      linkEl.textContent = link;
    });
    copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(currentLink); copyBtn.textContent = '복사됨 ✓'; setTimeout(() => (copyBtn.textContent = '링크 복사'), 1500); } catch {}
    });
    window.cward.ready();
  </script>
</body>
</html>
