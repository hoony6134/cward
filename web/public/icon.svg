<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#132a44"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4cf94"/>
      <stop offset="55%" stop-color="#c8aa6e"/>
      <stop offset="100%" stop-color="#8a6f3c"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7ab0"/>
      <stop offset="45%" stop-color="#ff3d82"/>
      <stop offset="100%" stop-color="#b51e5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4e8e" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ff4e8e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff4e8e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="100" fill="none" stroke="#c8aa6e" stroke-width="8" opacity="0.5"/>

  <!-- control-ward glow -->
  <circle cx="256" cy="196" r="150" fill="url(#glow)"/>

  <!-- totem stake -->
  <path d="M256 300 L306 330 L286 452 Q256 474 226 452 L206 330 Z" fill="url(#gold)"/>
  <path d="M256 300 L256 466 Q238 466 226 452 L206 330 Z" fill="#000" opacity="0.18"/>
  <path d="M216 356 H296 M224 400 H288" stroke="#0a1626" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

  <!-- gem cradle -->
  <path d="M196 300 Q256 262 316 300 L300 318 Q256 292 212 318 Z" fill="url(#gold)"/>

  <!-- faceted gem -->
  <g stroke="#ffd8e8" stroke-width="4" stroke-linejoin="round">
    <path d="M256 92 L330 178 L256 300 L182 178 Z" fill="url(#gem)"/>
    <path d="M256 92 L256 300 L182 178 Z" fill="#ff5f99" opacity="0.35" stroke="none"/>
    <path d="M182 178 H330" stroke-width="3" opacity="0.6"/>
    <path d="M256 92 L256 300" stroke-width="3" opacity="0.6"/>
  </g>
  <path d="M256 118 L300 170 L256 196 L212 170 Z" fill="#fff" opacity="0.5"/>
</svg>
