<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cward overlay</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      color: #e6edf6; user-select: none; -webkit-user-select: none;
    }
    /* Full-screen overlay; clicks pass through except on panels (pointer-events:auto). */
    #root { position: fixed; inset: 0; pointer-events: none; }

    .card {
      pointer-events: auto;
      background: rgba(10, 17, 28, 0.82); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border: 1px solid rgba(90, 120, 160, 0.28); border-radius: 12px; padding: 8px 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }
    .title { font-size: 10px; letter-spacing: .04em; color: #8aa0b8; text-transform: uppercase; margin-bottom: 6px; }
    .muted { color: #8aa0b8; }
    .row { display: flex; align-items: center; gap: 6px; }

    /* ---- positions (left/top come from inline styles so panels are draggable) ---- */
    .left-rail { position: fixed; display: flex; flex-direction: column; gap: 8px; max-height: 92vh; }
    .build-dock { position: fixed; width: max-content; max-width: 320px; }
    .top-hud { position: fixed; }
    .title { cursor: default; }

    /* ---- icons: never distort ---- */
    img { display: block; object-fit: cover; }
    .champ { width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgba(120,150,190,.3); flex-shrink: 0; }
    .chip {
      position: relative; width: 28px; height: 28px; border-radius: 6px; overflow: hidden; flex-shrink: 0;
      border: 1px solid rgba(120,150,190,.3); background: #122235; cursor: pointer; padding: 0;
    }
    .chip img { width: 100%; height: 100%; }
    .chip.cooling img { filter: grayscale(1) brightness(.45); }
    .chip .cd { position: absolute; inset: 0; display: grid; place-items: center; font: 700 11px ui-monospace, monospace; color: #fff; }
    .itm { width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgba(120,150,190,.3); flex-shrink: 0; }
    .rune { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(120,150,190,.3); flex-shrink: 0; }
    .sp { width: 24px; height: 24px; border-radius: 5px; flex-shrink: 0; }

    .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 17px; color: #e9c877; }
    .pill { font-size: 11px; } .pill b { color: #e9c877; font-weight: 600; }
    .sk-strip { display: inline-flex; gap: 2px; flex-wrap: wrap; vertical-align: middle; }
    .sk { font: 700 10px ui-monospace, monospace; width: 15px; height: 16px; display: inline-grid; place-items: center; border-radius: 3px; background: #1a2740; color: #cdd9ea; }
    .sk.done { opacity: .35; }
    .sk.next { background: #ff4fa3; color: #fff; box-shadow: 0 0 0 1px #ff4fa3; }
    .ability-bar { position: fixed; }
    .abil { position: relative; width: 38px; height: 38px; border-radius: 7px; overflow: hidden; border: 1px solid rgba(120,150,190,.3); background: #122235; flex-shrink: 0; }
    .abil img { width: 100%; height: 100%; }
    .abil.next { border-color: #ff4fa3; box-shadow: 0 0 0 2px #ff4fa3, 0 0 12px rgba(255,79,163,.7); }
    .abil-l { display: grid; place-items: center; width: 100%; height: 100%; font: 700 14px ui-monospace, monospace; color: #cdd9ea; }
    .abil-k { position: absolute; bottom: 0; right: 0; font: 700 9px ui-monospace, monospace; background: rgba(0,0,0,.65); padding: 0 3px; border-radius: 4px 0 0 0; }
    .cname { font-size: 11px; width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wrap { display: flex; gap: 4px; flex-wrap: wrap; }
    .idle { position: fixed; top: 12px; right: 12px; font-size: 11px; color: #8aa0b8; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/overlay.tsx"></script>
</body>
</html>
